name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  formato:
    name: Formato y lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # La advertencia de hoy es el unwrap que revienta en producción el mes que viene
      - run: cargo clippy --all-targets --all-features -- -D warnings

  pruebas:
    name: Pruebas
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jobout
          POSTGRES_PASSWORD: jobout
          POSTGRES_DB: jobout_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgres://jobout:jobout@localhost:5432/jobout_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Unitarias
        run: cargo test --lib --bins
      - name: Integración
        run: cargo test --tests

  migraciones:
    name: Migraciones reversibles
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jobout
          POSTGRES_PASSWORD: jobout
          POSTGRES_DB: jobout_migrations
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgres://jobout:jobout@localhost:5432/jobout_migrations
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Toda migración implementa down
        run: |
          # m[0-9]* y no m*: las migraciones de SeaORM son m20260903_120000_nombre.rs,
          # y un glob 'm*.rs' también matchea main.rs
          faltan=$(grep -rLn 'async fn down' migration/src --include='m[0-9]*.rs' || true)
          if [ -n "$faltan" ]; then
            echo "::error::migraciones sin down: $faltan"
            exit 1
          fi
          echo "Todas las migraciones implementan down"
      - name: Aplica y revierte limpio
        run: |
          cargo run --bin migration -- up
          cargo run --bin migration -- down -n 1 || echo "sin migraciones que revertir todavía"
          cargo run --bin migration -- up

  docker:
    name: La imagen compila
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  secretos:
    name: Sin secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ningún archivo de secretos ni compose local versionado
        run: |
          hits=$(git ls-files | grep -E '(^|/)\.env($|\.)|\.(pem|key|p8|p12)$|^docker-compose\.yml$' | grep -v '\.env\.example$' || true)
          if [ -n "$hits" ]; then
            echo "::error::archivos que no deben versionarse:"; echo "$hits"; exit 1
          fi
      - name: Ninguna credencial embebida
        run: |
          pat='AKIA[0-9A-Z]{16}|sk_live_[0-9a-zA-Z]{16,}|sk-[A-Za-z0-9]{32,}|gh[pousr]_[A-Za-z0-9]{36,}|-----BEGIN [A-Z ]*PRIVATE KEY-----'
          hits=$(git ls-files -z | xargs -0 grep -InE "$pat" -- 2>/dev/null | grep -v '^.github/workflows/' || true)
          if [ -n "$hits" ]; then echo "::error::posible credencial:"; echo "$hits"; exit 1; fi

  pr:
    name: PR completo
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: La rama sigue el formato jb-##-slug
        run: |
          rama="${{ github.head_ref }}"
          echo "$rama" | grep -qE '^jb-[0-9]+-[a-z0-9-]+$' || {
            echo "::error::rama '$rama' no sigue el formato jb-##-slug"; exit 1; }
      - name: Las cuatro secciones del PR están completas
        env:
          CUERPO: ${{ github.event.pull_request.body }}
        run: |
          faltan=0
          for s in "Qué se hizo" "Cómo se resolvió" "Archivos tocados" "Migraciones"; do
            echo "$CUERPO" | grep -qF "$s" || { echo "::error::falta '$s'"; faltan=1; }
          done
          [ "$faltan" -eq 0 ]
      - name: Una migración obliga a documentarla
        env:
          CUERPO: ${{ github.event.pull_request.body }}
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -q 'migration/src/m'; then
            echo "$CUERPO" | grep -qiE 'documentation/db\.md|db\.md actualizado' || {
              echo "::error::el PR trae una migración: documentá el cambio en jobout-docs/documentation/db.md y decilo en la sección Migraciones"
              exit 1; }
          fi
